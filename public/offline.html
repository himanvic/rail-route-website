<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#171715" />
  <title>Offline — Rail & Route</title>
  <style>
    :root{color-scheme:light;--paper:#f7f5ef;--ink:#201f1b;--muted:#77746c;--gold:#b08d57;--deep:#171715}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--paper);color:var(--ink);font:15px/1.7 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(520px,100%);padding:clamp(24px,6vw,42px);border:1px solid #dedbd1;background:#fffefa;box-shadow:0 18px 55px #17171510;text-align:center}
    .mark{width:58px;height:58px;display:grid;place-items:center;margin:0 auto 22px;border-radius:16px 16px 16px 4px;border:1px solid #8b6f41;background:var(--deep);color:#d8b77a;font-size:27px}
    h1{font:400 clamp(32px,7vw,45px)/1.1 Georgia,serif;margin:0 0 14px}p{color:var(--muted);font-size:13px;margin:0 0 22px}
    button{border:0;padding:13px 19px;background:var(--deep);color:#fff;border-radius:3px;font-weight:650;cursor:pointer}
    small{display:block;margin-top:20px;color:var(--muted);font-size:11px}
  </style>
</head>
<body><main><div class="mark" aria-hidden="true">🚆</div><h1>You're offline.</h1><p>Rail & Route can reopen its saved website shell and timetable files when available. Live train status and nearby weather need a connection.</p><button type="button" onclick="location.reload()">Try again</button><small>Reconnect to the internet for fresh railway information.</small></main></body>
</html>
